<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Lianjfkt - Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a13"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(-60px)}to{transform:translateY(340px)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 4s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.45}}
  </style>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="pulse" cx="180" cy="60" r="110" fill="#00f0ff" opacity="0.28" filter="url(#blur)"/>
    <circle class="pulse" cx="1030" cy="270" r="120" fill="#ff2bd6" opacity="0.25" filter="url(#blur)"/>
    <circle cx="640" cy="160" r="140" fill="#8b5cf6" opacity="0.14" filter="url(#blur)"/>

    <!-- terminal label -->
    <text class="mono" x="40" y="48" font-size="15" fill="#39ff14">$ whoami<tspan class="blink" fill="#00f0ff"> █</tspan></text>
    <circle cx="1100" cy="42" r="6" fill="#ff2bd6"/>
    <circle cx="1124" cy="42" r="6" fill="#8b5cf6"/>
    <circle cx="1148" cy="42" r="6" fill="#00f0ff"/>

    <!-- title -->
    <text class="mono" x="600" y="170" font-size="88" font-weight="800" letter-spacing="10" text-anchor="middle" fill="url(#neon)" filter="url(#glow)">LIANJFKT</text>
    <text class="mono" x="600" y="220" font-size="20" text-anchor="middle" fill="#9fb3c8">Full-Stack Developer  //  Web Systems for Schools &amp; Small Business</text>
    <text class="mono" x="600" y="262" font-size="15" letter-spacing="4" text-anchor="middle" fill="#00f0ff">JAVASCRIPT  ·  TYPESCRIPT  ·  HTML</text>

    <!-- corner brackets -->
    <g fill="none" stroke="url(#neon)" stroke-width="3" stroke-linecap="round">
      <path d="M24 84V24H84"/>
      <path d="M1176 236V296H1116"/>
    </g>

    <!-- scanline -->
    <rect class="scan" x="0" y="0" width="1200" height="60" fill="url(#scanGrad)"/>

    <!-- bottom neon line -->
    <rect x="0" y="314" width="1200" height="6" fill="url(#neon)" filter="url(#glow)"/>
  </g>
</svg>
